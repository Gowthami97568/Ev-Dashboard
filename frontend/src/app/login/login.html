<main class="login-page">
  <section class="login-panel" aria-labelledby="login-title">
    <div class="login-brand" aria-hidden="true">EV</div>
    <p class="login-kicker">Charging Management System</p>
    <h1 id="login-title">Admin sign in</h1>
    <p class="login-intro">Sign in to access your operations dashboard.</p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="Enter admin username">
      <small *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">Username is required.</small>

      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Enter password">
        <button
          type="button"
          class="password-toggle"
          [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
          [attr.title]="isPasswordVisible ? 'Hide password' : 'Show password'"
          (click)="togglePasswordVisibility()">
          <svg *ngIf="isPasswordVisible" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.4-5 9.5-5 9.5 5 9.5 5-3.4 5-9.5 5-9.5-5-9.5-5Z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
          </svg>
          <svg *ngIf="!isPasswordVisible" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3l18 18"></path>
            <path d="M10.6 6.9A10.5 10.5 0 0 1 12 6.8c6.1 0 9.5 5.2 9.5 5.2a17.4 17.4 0 0 1-3.2 3.4M6.2 6.2C3.9 7.7 2.5 12 2.5 12s3.4 5.2 9.5 5.2c1.5 0 2.8-.3 4-.8"></path>
          </svg>
        </button>
      </div>
      <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">Password is required.</small>

      <p class="login-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button type="submit" class="login-submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </section>
</main>
