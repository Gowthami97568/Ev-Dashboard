<main class="login-shell">
  <section class="login-aside" aria-hidden="true">
    <div class="aside-top">
      <div class="aside-brand">
        <img src="/logo.png" alt="EV ChargeMan">
      </div>
      <p class="aside-copy">Every charger, every session, one dashboard.</p>
    </div>

    <div class="aside-visual">
      <svg viewBox="0 0 320 220" class="charge-graphic">
        <rect x="18" y="30" width="70" height="150" rx="10" class="cg-station"></rect>
        <circle cx="53" cy="52" r="6" class="cg-led"></circle>
        <rect x="30" y="70" width="46" height="30" rx="4" class="cg-screen"></rect>
        <path d="M46 78 L58 78 L50 90 L62 90 L44 108 L48 92 L38 92 Z" class="cg-bolt"></path>
        <path d="M88 96 C 150 96, 150 150, 205 150" class="cg-cable"></path>
        <g class="cg-car">
          <rect x="205" y="120" width="95" height="42" rx="14" class="cg-body"></rect>
          <rect x="220" y="104" width="55" height="26" rx="10" class="cg-cabin"></rect>
          <circle cx="228" cy="164" r="12" class="cg-wheel"></circle>
          <circle cx="282" cy="164" r="12" class="cg-wheel"></circle>
        </g>
      </svg>
    </div>

    <div class="aside-stats">
      <div class="stat-row">
        <span class="stat-dot"></span>
        <span class="stat-figure">128</span>
        <span class="stat-label">chargers online</span>
      </div>
      <div class="stat-row">
        <span class="stat-dot stat-dot--warn"></span>
        <span class="stat-figure">3</span>
        <span class="stat-label">sites need attention</span>
      </div>
    </div>
  </section>

  <section class="login-main" aria-labelledby="login-title">
    <div class="login-form-wrap">
      <p class="form-kicker">Charging Management System</p>
      <h1 id="login-title">sign in</h1>
      <p class="login-intro">Sign in to access your operations dashboard.</p>

      <form [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="field-control">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4"></circle>
              <path d="M4.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"></path>
            </svg>
            <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="Enter admin username">
          </div>
          <small *ngIf="loginForm.controls.username.touched && loginForm.controls.username.invalid">Username is required.</small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="field-control">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10.5" width="14" height="9.5" rx="2"></rect>
              <path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"></path>
            </svg>
            <input id="password" [type]="isPasswordVisible ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Enter password">
            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
              [attr.title]="isPasswordVisible ? 'Hide password' : 'Show password'"
              (click)="togglePasswordVisibility()">
              <svg *ngIf="isPasswordVisible" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.4-5 9.5-5 9.5 5 9.5 5-3.4 5-9.5 5-9.5-5-9.5-5Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
              <svg *ngIf="!isPasswordVisible" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18"></path>
                <path d="M10.6 6.9A10.5 10.5 0 0 1 12 6.8c6.1 0 9.5 5.2 9.5 5.2a17.4 17.4 0 0 1-3.2 3.4M6.2 6.2C3.9 7.7 2.5 12 2.5 12s3.4 5.2 9.5 5.2c1.5 0 2.8-.3 4-.8"></path>
              </svg>
            </button>
          </div>
          <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">Password is required.</small>
        </div>

        <p class="login-error" *ngIf="errorMessage" role="alert">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9.25"></circle>
            <path d="M12 7.5v5.5"></path>
            <circle cx="12" cy="16.3" r="0.9"></circle>
          </svg>
          {{ errorMessage }}
        </p>

        <button type="submit" class="login-submit" [class.is-loading]="isSubmitting" [disabled]="isSubmitting">
          <span class="submit-bolt" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M13 2 4 14h6l-1 8 10-13h-7z"></path>
            </svg>
          </span>
          <span class="submit-label">{{ isSubmitting ? 'Signing in...' : 'Sign in' }}</span>
        </button>
      </form>
    </div>
  </section>
</main>
