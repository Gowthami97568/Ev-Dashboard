<div class="rounded-xl2 border border-ink-100 bg-white p-5 shadow-card">
  <span class="mb-4 flex h-9 w-9 items-center justify-center rounded-lg bg-brand-50 text-brand-600">
    @switch (icon) {
      @case ('ev-station') {
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="10" height="16" rx="1.5"/><path d="M17 8h1a2 2 0 0 1 2 2v6a1.5 1.5 0 0 1-3 0v-2"/></svg>
      }
      @case ('bolt') {
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m13 2-8 11h6l-1 9 8-11h-6l1-9Z"/></svg>
      }
      @case ('flash') {
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
      }
      @case ('currency') {
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1.4 1.1-2.5 2.5-2.5s2.5 1 2.5 2.2c0 2.8-5 1.6-5 4.3 0 1.4 1.1 2.5 2.5 2.5s2.5-1.1 2.5-2.5"/></svg>
      }
    }
  </span>

  <p class="text-xs font-semibold uppercase tracking-wider text-ink-400">{{ label }}</p>
  <p class="mt-1.5 text-[28px] font-bold leading-none text-ink-900">{{ value }}</p>

  <div class="mt-3 flex items-center gap-1.5 text-xs">
    <span class="flex items-center gap-0.5 font-medium" [class.text-brand-600]="trend === 'up'" [class.text-red-500]="trend === 'down'">
      <svg viewBox="0 0 24 24" class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="2.5" [class.rotate-180]="trend === 'down'">
        <path d="M7 17 17 7M9 7h8v8" />
      </svg>
      {{ deltaText }}
    </span>
    @if (footnote) {
      <span class="text-ink-400">{{ footnote }}</span>
    }
  </div>
</div>
