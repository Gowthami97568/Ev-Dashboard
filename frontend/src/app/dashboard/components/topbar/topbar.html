<header
  class="topbar-header sticky top-0 z-50 flex w-full min-w-0 shrink-0 items-center justify-between gap-4 overflow-visible bg-[#f8fafc] px-8"
>
  <div class="topbar-brand" aria-label="EVChargeMan Charging Management System">
    <span class="topbar-brand-name">EVChargeMan</span>
    <span class="topbar-brand-divider" aria-hidden="true"></span>
    <span class="topbar-brand-description">Charging Management System</span>
  </div>

  <div class="flex min-w-0 items-center justify-end gap-3">
    <!-- PROFILE -->
    <div class="relative">
      <button
        type="button"
        aria-label="Open profile menu"
        [attr.aria-expanded]="isProfileMenuOpen"
        aria-haspopup="menu"
        class="flex items-center gap-2.5 rounded-xl border border-ink-100 bg-white py-1.5 pl-1.5 pr-3 shadow-card transition-colors hover:border-brand-200 hover:bg-brand-50 focus:outline-none focus:ring-2 focus:ring-brand-200"
        (click)="toggleProfileMenu()"
      >
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-600 text-xs font-bold text-white ring-2 ring-brand-100"
        >
          {{ initials }}
        </span>

        <span class="leading-tight">
          <span
            class="block max-w-[120px] truncate text-left text-sm font-medium text-ink-900"
          >
            {{ currentUser.name }}
          </span>

          <span
            class="block max-w-[120px] truncate text-left text-xs text-ink-500"
          >
            {{ currentUser.role }}
          </span>
        </span>

        <svg
          viewBox="0 0 24 24"
          class="h-4 w-4 shrink-0 text-ink-400 transition-transform duration-150"
          [class.rotate-180]="isProfileMenuOpen"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </button>

      <!-- PROFILE MENU -->
      <div
        *ngIf="isProfileMenuOpen"
        role="menu"
        class="absolute right-0 top-[calc(100%+8px)] z-30 w-56 overflow-hidden rounded-xl border border-ink-100 bg-white shadow-card"
      >
        <div class="border-b border-ink-100 bg-ink-50 px-3.5 py-3">
          <p
            class="mb-1 text-[10px] font-semibold uppercase tracking-[0.16em] text-ink-400"
          >
            Signed in as
          </p>

          <p class="truncate text-sm font-medium text-ink-900">
            {{ currentUser.name }}
          </p>

          <p class="truncate text-xs text-ink-400">
            {{ currentUser.role }}
          </p>
        </div>

        <a
          role="menuitem"
          routerLink="/settings"
          (click)="closeProfileMenu()"
          class="flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-ink-600 hover:bg-ink-50"
        >
          Account settings
        </a>

        <button
          role="menuitem"
          type="button"
          (click)="signOut()"
          class="flex w-full items-center gap-2.5 border-t border-ink-100 px-3.5 py-2.5 text-left text-sm text-red-600 hover:bg-red-50"
        >
          Sign out
        </button>
      </div>
    </div>
  </div>
</header>
